<div class="px-4 pt-2">
  <h1 class="mb-4 text-xl">Projects</h1>
</div>


<!-- Project Grid -->
<main class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 px-4">

  <!-- Card 1: Construction -->
  <a class="group flex flex-col bg-white rounded-xl border border-gray-200 overflow-hidden hover:border-[#0C8CE9] hover:shadow-md transition-all cursor-pointer" [routerLink]="['/project/1']">
    <div class="aspect-[4/3] bg-[#E5E5E5] flex items-center justify-center relative overflow-hidden border-b border-gray-100 p-4">
      <!-- Mobile Frame -->
      <div class="w-[110px] h-[180px] bg-amber-50 rounded-2xl shadow-lg border border-amber-200/50 p-2 flex flex-col justify-between overflow-hidden group-hover:scale-[1.04] transition-transform duration-300">
        <div class="w-12 h-2 bg-amber-200/40 rounded-full mx-auto mb-1"></div>
        <div class="flex-1 flex flex-col gap-1.5 mt-1">
          <div class="h-3 w-12 bg-amber-500 rounded-sm"></div>
          <div class="h-4 w-full bg-slate-800 rounded-sm"></div>
          <div class="h-2 w-5/6 bg-slate-400 rounded-sm"></div>
          <!-- Grid Layout (Under Construction) -->
          <div class="grid grid-cols-2 gap-1 mt-1">
            <div class="h-14 bg-amber-500 rounded flex items-center justify-center text-[10px] text-white font-bold">🏗️</div>
            <div class="h-14 bg-slate-800 rounded flex items-center justify-center text-[10px] text-white font-bold">🛠️</div>
          </div>
        </div>
      </div>
    </div>
    <div class="p-4 flex flex-col flex-1 justify-between">
      <div>
        <h3 class="font-medium text-sm text-gray-900 truncate">Construction</h3>
        <p class="text-xs text-gray-400 mt-1">Industrial & Architecture</p>
      </div>
      <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-50">
        <span class="text-[11px] bg-amber-50 text-amber-700 px-2 py-0.5 rounded font-medium">Solid</span>
      </div>
    </div>
  </a>

  <!-- Card 2: Fintech -->
  <div class="group flex flex-col bg-white rounded-xl border border-gray-200 overflow-hidden hover:border-[#0C8CE9] hover:shadow-md transition-all cursor-pointer">
    <div class="aspect-[4/3] bg-[#E5E5E5] flex items-center justify-center relative overflow-hidden border-b border-gray-100 p-4">
      <!-- Mobile Frame -->
      <div class="w-[110px] h-[180px] bg-[#0F172A] rounded-2xl shadow-lg border border-slate-800 p-2 flex flex-col justify-between overflow-hidden group-hover:scale-[1.04] transition-transform duration-300">
        <div class="w-12 h-2 bg-slate-800 rounded-full mx-auto mb-1"></div>
        <div class="flex-1 flex flex-col gap-1.5 mt-1">
          <div class="flex justify-between items-center"><div class="h-2 w-6 bg-emerald-400 rounded-sm"></div><div class="h-2 w-2 bg-slate-700 rounded-full"></div></div>
          <div class="h-3 w-4/5 bg-white rounded-sm mt-1"></div>
          <!-- Credit Card Mockup -->
          <div class="h-14 bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 rounded-lg p-1.5 flex flex-col justify-between mt-1 border border-white/10 shadow-inner">
            <div class="h-1.5 w-3 bg-yellow-400/80 rounded-sm"></div>
            <div class="flex justify-between items-center"><div class="h-1 w-6 bg-white/40 rounded-sm"></div><div class="w-2 h-2 bg-white/30 rounded-full"></div></div>
          </div>
          <div class="h-6 w-full bg-emerald-500 rounded-md mt-auto shadow-lg shadow-emerald-500/20"></div>
        </div>
      </div>
    </div>
    <div class="p-4 flex flex-col flex-1 justify-between">
      <div>
        <h3 class="font-medium text-sm text-gray-900 truncate">Fintech</h3>
        <p class="text-xs text-gray-400 mt-1">Banking & Crypto Wallet</p>
      </div>
      <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-50">
        <span class="text-[11px] bg-slate-900 text-slate-100 px-2 py-0.5 rounded font-medium">Dark UI</span>
      </div>
    </div>
  </div>

  <!-- Card 3: Dogs Grooming -->
  <div class="group flex flex-col bg-white rounded-xl border border-gray-200 overflow-hidden hover:border-[#0C8CE9] hover:shadow-md transition-all cursor-pointer">
    <div class="aspect-[4/3] bg-[#E5E5E5] flex items-center justify-center relative overflow-hidden border-b border-gray-100 p-4">
      <!-- Mobile Frame -->
      <div class="w-[110px] h-[180px] bg-[#FAF7F2] rounded-2xl shadow-lg border border-orange-100 p-2 flex flex-col justify-between overflow-hidden group-hover:scale-[1.04] transition-transform duration-300">
        <div class="w-12 h-2 bg-orange-100 rounded-full mx-auto mb-1"></div>
        <div class="flex-1 flex flex-col gap-1.5 mt-1 items-center text-center">
          <div class="h-12 w-12 rounded-full bg-orange-200 flex items-center justify-center text-lg shadow-sm">🐶</div>
          <div class="h-3 w-full bg-orange-950 rounded-sm mt-0.5"></div>
          <div class="h-1.5 w-4/5 bg-orange-900/30 rounded-sm"></div>
          <!-- Booking Button Mock -->
          <div class="h-5 w-full bg-orange-500 rounded-full mt-auto flex items-center justify-center"><div class="h-1 w-6 bg-white rounded-full"></div></div>
        </div>
      </div>
    </div>
    <div class="p-4 flex flex-col flex-1 justify-between">
      <div>
        <h3 class="font-medium text-sm text-gray-900 truncate">Dogs Grooming</h3>
        <p class="text-xs text-gray-400 mt-1">Pet Care & Booking</p>
      </div>
      <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-50">
        <span class="text-[11px] bg-orange-50 text-orange-700 px-2 py-0.5 rounded font-medium">Playful</span>
      </div>
    </div>
  </div>

  <!-- Card 4: Food Service -->
  <div class="group flex flex-col bg-white rounded-xl border border-gray-200 overflow-hidden hover:border-[#0C8CE9] hover:shadow-md transition-all cursor-pointer">
    <div class="aspect-[4/3] bg-[#E5E5E5] flex items-center justify-center relative overflow-hidden border-b border-gray-100 p-4">
      <!-- Mobile Frame -->
      <div class="w-[110px] h-[180px] bg-white rounded-2xl shadow-lg border border-gray-100 p-2 flex flex-col justify-between overflow-hidden group-hover:scale-[1.04] transition-transform duration-300">
        <div class="w-12 h-2 bg-gray-100 rounded-full mx-auto mb-1"></div>
        <div class="flex-1 flex flex-col gap-2 mt-1">
          <div class="flex justify-between items-center"><div class="h-2 w-8 bg-red-500 rounded-sm"></div><div class="text-[9px]">🛒</div></div>
          <div class="h-3 w-full bg-neutral-800 rounded-sm"></div>
          <!-- Food Item Card -->
          <div class="bg-neutral-50 border border-neutral-100 rounded-lg p-1 flex flex-col gap-1">
            <div class="h-12 bg-amber-100 rounded-md flex items-center justify-center text-lg">🍔</div>
            <div class="h-1.5 w-2/3 bg-neutral-300 rounded-sm"></div>
            <div class="flex justify-between items-center mt-0.5"><div class="h-2 w-4 bg-emerald-500 rounded-sm"></div><div class="w-3 h-3 bg-red-500 text-[8px] text-white rounded-full flex items-center justify-center font-bold">+</div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="p-4 flex flex-col flex-1 justify-between">
      <div>
        <h3 class="font-medium text-sm text-gray-900 truncate">Food Service</h3>
        <p class="text-xs text-gray-400 mt-1">Delivery & Restaurant</p>
      </div>
      <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-50">
        <span class="text-[11px] bg-red-50 text-red-600 px-2 py-0.5 rounded font-medium">Appetizing</span>
      </div>
    </div>
  </div>

  </main>
