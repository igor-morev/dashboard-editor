
<form [formGroup]="authForm" (ngSubmit)="onSubmit()">
  <p class="mb-4 text-gray-700">
    {{ isLoginMode ? 'Please enter your credentials to login.' : 'Please fill in the form to register.' }}
  </p>
  <div class="mb-2">
    <label for="username">Username:</label>
    <input id="username" formControlName="username" required class="de-input"/>
  </div>
  <div class="mb-4">
    <label for="password">Password:</label>
    <input id="password" type="password" formControlName="password" required class="de-input"/>
  </div>

  <button
    type="submit"
    [disabled]="authForm.invalid || isSubmitting()"
    class="de-primary-button mb-2 flex items-center justify-center gap-x-2"
  >
    @if (isSubmitting()) {
      <mat-spinner diameter="16"></mat-spinner>
    }
    {{ isLoginMode ? 'Sign in' : 'Sign up' }}
  </button>

  @if (isLoginMode) {
    <p class=>
      Don't have an account? <a routerLink="/register" class="text-blue-500 hover:underline">Register here</a>.
    </p>
  } @else {
    <p>
      Already have an account? <a routerLink="/login" class="text-blue-500 hover:underline">Login here</a>.
    </p>
  }
  
</form>
