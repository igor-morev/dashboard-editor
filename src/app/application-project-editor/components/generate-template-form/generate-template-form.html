<div class="w-full max-w-md mx-auto p-4">
  <div class="bg-surface border border-contrast/10 rounded-theme p-6 shadow-xl">
    <!-- Заголовок -->
    <div class="mb-6 text-center">
      <h2 class="font-heading text-site-h2 font-black text-contrast mb-2">Генерация Магией AI</h2>
      <p class="font-body text-site-body opacity-70">
        Заполните параметры, и нейросеть соберет готовый лендинг
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- 1. Выбор Индустрии -->
      <div>
        <label class="block text-sm font-semibold mb-2 text-contrast">1. Выберите индустрию</label>
        <div class="grid grid-cols-2 gap-2">
          @for (ind of industries; track ind.value) {
            <button
              type="button"
              (click)="selectedIndustry.set(ind.value)"
              [class.bg-primary]="selectedIndustry() === ind.value"
              [class.text-white]="selectedIndustry() === ind.value"
              [class.bg-contrast/5]="selectedIndustry() !== ind.value"
              [class.text-contrast]="selectedIndustry() !== ind.value"
              class="p-3 text-sm rounded-theme font-medium transition-all text-left flex items-center justify-between border border-transparent active:scale-95"
            >
              {{ ind.label }}
            </button>
          }
        </div>
      </div>

      <!-- 2. Выбор Настроения/Стиля -->
      <div>
        <label class="block text-sm font-semibold mb-2 text-contrast">2. Визуальный стиль</label>
        <select
          [ngModel]="selectedMood()"
          (ngModelChange)="selectedMood.set($event)"
          name="mood"
          class="w-full p-3 bg-contrast/5 border border-contrast/10 rounded-theme font-body text-contrast focus:outline-none focus:border-primary"
        >
          @for (mood of moods; track mood.value) {
            <option [value]="mood.value">{{ mood.label }}</option>
          }
        </select>
      </div>

      <!-- 3. Текстовое описание -->
      <div>
        <label class="block text-sm font-semibold mb-2 text-contrast">3. Детали и пожелания</label>
        <textarea
          [ngModel]="userPrompt()"
          (ngModelChange)="userPrompt.set($event)"
          name="prompt"
          rows="4"
          [placeholder]="currentPlaceholder"
          class="w-full p-3 bg-contrast/5 border border-contrast/10 rounded-theme font-body text-contrast placeholder:text-contrast/40 focus:outline-none focus:border-primary resize-none"
        ></textarea>
      </div>

      <!-- Вывод ошибки -->
      @if (errorMessage()) {
        <div
          class="p-3 bg-rose-500/10 text-rose-500 text-sm rounded-theme border border-rose-500/20"
        >
          {{ errorMessage() }}
        </div>
      }

      <!-- Кнопка отправки -->
      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full bg-primary text-white font-heading font-bold py-4 rounded-theme shadow-md transition-all active:scale-[0.98] disabled:opacity-50 flex items-center justify-center gap-2"
      >
        @if (isLoading()) {
          <!-- Простой спиннер -->
          <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          <span>Магия создается...</span>
        } @else {
          ✨ Сгенерировать сайт
        }
      </button>
    </form>
  </div>
</div>
