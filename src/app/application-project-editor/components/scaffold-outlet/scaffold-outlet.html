<div data-scaffold class="w-md bg-white min-h-full shadow-md mr-auto ml-auto">
  <ng-container
    *ngTemplateOutlet="
      layersTemplate;
      context: {
        $implicit: layers(),
      }
    "
  ></ng-container>

  <ng-template #layersTemplate let-layersTree>
    @for (layer of layersTree; track layer.id) {
      @if (layer.isVisible) {
        <de-layer
          [layer]="layer"
          [selected]="layer.id === selectedLayer().id"
          [highlighted]="layer.id === highlightedLayer()?.id"
          [editingLayer]="editingLayerId() === layer.id"
          [layersTemplate]="layersTemplate"
          (onStartEditingLayer)="startEditingLayer(layer.id)"
          (onSaveEditingLayerName)="saveLayerName($event, layer)"
          (onCancelEditingLayer)="cancelEditingLayer()"
        />
      }
    }
  </ng-template>
</div>
