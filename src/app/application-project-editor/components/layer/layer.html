@switch (layer().widgetReference.widgetType) {
  @case ('section') {
    <de-layer-content [selected]="selected()" [highlighted]="highlighted()">
      <section
        [class]="layer().widgetReference.defaultWidgetPropertyModel.class"
        [class]="layer().layerPropertyModel | layerAttributeTransform: buildLayerTailwindClasses"
        [style]="layer().layerPropertyModel | layerAttributeTransform: buildLayerStyleAttribute"
      >
        @if (layer().children) {
          <ng-container
            *ngTemplateOutlet="
              layersTemplate();
              context: {
                $implicit: layer().children,
              }
            "
          ></ng-container>
        }
      </section>
    </de-layer-content>
  }

  @case ('heading') {
    <de-layer-content [selected]="selected()" [highlighted]="highlighted()">
      <h1
        [class]="layer().widgetReference.defaultWidgetPropertyModel.class"
        [class]="layer().layerPropertyModel | layerAttributeTransform: buildLayerTailwindClasses"
      >
        {{ layer().layerPropertyModel.content }}
      </h1>
    </de-layer-content>
  }

  @case ('text') {
    <de-layer-content [selected]="selected()" [highlighted]="highlighted()">
      <p
        [class]="layer().widgetReference.defaultWidgetPropertyModel.class"
        [class]="layer().layerPropertyModel | layerAttributeTransform: buildLayerTailwindClasses"
      >
        {{ layer().layerPropertyModel.content }}
      </p>
    </de-layer-content>
  }

  @case ('image') {
    <de-layer-content [selected]="selected()" [highlighted]="highlighted()">
      <img
        [class]="layer().widgetReference.defaultWidgetPropertyModel.class"
        [src]="layer().widgetReference.renderContent"
      />
    </de-layer-content>
  }

  @default {
    <de-layer-content [selected]="selected()" [highlighted]="highlighted()">
      <div
        [class]="layer().widgetReference.defaultWidgetPropertyModel.class"
        [class]="layer().layerPropertyModel | layerAttributeTransform: buildLayerTailwindClasses"
      >
        @if (layer().children) {
          <ng-container
            *ngTemplateOutlet="
              layersTemplate();
              context: {
                $implicit: layer().children,
              }
            "
          ></ng-container>
        }
      </div>
    </de-layer-content>
  }
}
