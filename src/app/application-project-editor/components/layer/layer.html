@switch (layer().widgetReference.widgetType) {
  @case ('section') {
    <de-layer-content [selected]="selected()">
      <section [class]="layer().widgetReference.defaultWidgetPropertyModel.class">
        @if (layer().children) {
          <ng-container *ngTemplateOutlet="layersTemplate(); context: {
            $implicit: layer().children
          }"></ng-container>
         }
      </section>
    </de-layer-content>
  }

  @case ('text') {
    <de-layer-content [selected]="selected()">
      <p [class]="layer().widgetReference.defaultWidgetPropertyModel.class">{{layer().widgetReference.renderContent}}</p>
    </de-layer-content>
  }

  @case ('image') {
    <de-layer-content [selected]="selected()">
      <img [class]="layer().widgetReference.defaultWidgetPropertyModel.class" [src]="layer().widgetReference.renderContent" />
    </de-layer-content>
  }

  @default {
    <de-layer-content [selected]="selected()">
      <div [class]="layer().widgetReference.defaultWidgetPropertyModel.class">
        @if (layer().children) {
          <ng-container *ngTemplateOutlet="layersTemplate(); context: {
            $implicit: layer().children,
          }"></ng-container>
         }
        </div>
    </de-layer-content>
    
    
  }
}
