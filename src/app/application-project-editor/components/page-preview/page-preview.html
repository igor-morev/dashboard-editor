<div class="h-full w-full flex flex-col">
  <div
    class="h-12 min-h-12 px-4 flex items-center justify-between bg-white border-0 border-b border-gray-300 border-solid"
  >
    <span class="text-sm text-gray-500">Preview</span>
    <button matButton (click)="backToEditor()">
      <mat-icon>arrow_back</mat-icon>
      Back to editor
    </button>
  </div>

  <div class="grow relative bg-gray-100">
    @if (isLoading()) {
      <div class="absolute inset-0 flex items-center justify-center text-sm text-gray-400">
        Loading preview…
      </div>
    } @else if (error()) {
      <div class="absolute inset-0 flex items-center justify-center text-sm text-rose-600">
        {{ error() }}
      </div>
    } @else if (previewUrl()) {
      <iframe [src]="previewUrl()" class="w-full h-full border-0" title="Page preview"></iframe>
    }
  </div>
</div>
