<div class="de-notifications-host">
  @for (notification of notifications(); track notification.id) {
    <div class="de-notification de-notification--{{ notification.type }}">
      <span class="de-notification__message">{{ notification.message }}</span>
      <button
        type="button"
        class="de-notification__dismiss"
        aria-label="Dismiss"
        (click)="dismiss(notification.id)"
      >
        &times;
      </button>
    </div>
  }
</div>
